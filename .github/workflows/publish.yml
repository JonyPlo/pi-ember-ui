name: Publish to npm

# Runs only when you push a version tag such as v0.1.1 (created by `npm version`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # lets npm use Trusted Publishing (OIDC): no npm token stored in GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm CLI 11.15.0 or newer.
      - run: npm install -g npm@latest

      # Uploads the package to npm's stage queue. It is NOT installable until you
      # approve it (npmjs.com > package > Staged Packages > Approve, or `npm stage approve <id>`).
      - run: npm stage publish
